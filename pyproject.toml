[project]
name = "ML-project"
version = "1.0.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "psycopg>=3.3.8",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
