[project]
name = "ML-project"
version = "1.0.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=27.0.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
train = [
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
# Local `uv sync`/`uv run` install everything; the Docker image skips the
# training-only group with `--no-default-groups`.
default-groups = ["dev", "train"]
